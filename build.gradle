buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '0.1.0'
group = 'com.MechGaming.settlements'
archivesBaseName = 'Settlements'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Settlements",
            "Specification-Vendor": "MechGaming",
            "Specification-Version": "1",
            "Implementation-Title": "Settlements",
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "MechGaming"
        ])
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}

// Forge 1.12.2 expects classes and resources together during development.
sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}

// Forge 1.12.2 has no modern DataGenerator API. This isolated Java 8 source set
// generates the legacy resource formats without launching Minecraft.
sourceSets {
    datagen { java.srcDir 'src/datagen/java' }
    main { resources.srcDir 'src/generated/resources' }
}
dependencies {
    // Parse artist exports during DataGen; this is not bundled into the mod.
    datagenImplementation 'com.google.code.gson:gson:2.8.0'
}

task generateResources(type: JavaExec) {
    group = 'settlements'
    description = 'Generate Settlements metadata, recipes, models and language files.'
    dependsOn datagenClasses
    classpath = sourceSets.datagen.runtimeClasspath
    main = 'com.MechGaming.settlements.datagen.SettlementsDataGenerator'
    args file('src/generated/resources').absolutePath, project.version.toString()
    inputs.files(sourceSets.datagen.allSource)
    inputs.property('modVersion', project.version.toString())
    outputs.dir file('src/generated/resources')
}

task runData {
    group = 'settlements'
    description = 'Alias for the legacy DataGen entry point.'
    dependsOn generateResources
}

processResources {
    dependsOn generateResources
    // Artist-supplied overrides in src/main/resources take precedence.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task verifyGeneratedResources(type: JavaExec) {
    group = 'verification'
    dependsOn generateResources
    classpath = sourceSets.datagen.runtimeClasspath
    main = 'com.MechGaming.settlements.datagen.SettlementsDataGenerator'
    args file('src/generated/resources').absolutePath, project.version.toString(), '--verify'
}
check.dependsOn verifyGeneratedResources

sourceSets {
    verification {
        java.srcDir 'src/verification/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
task verifySettlementState(type: JavaExec) {
    group = 'verification'
    description = 'Check claim geometry, persistent NBT round trips and packet validation without launching the game.'
    dependsOn verificationClasses
    classpath = sourceSets.verification.runtimeClasspath
    main = 'com.MechGaming.settlements.verification.StateVerification'
}
check.dependsOn verifySettlementState
